name: Cypress Tests

on:
  push:
    branches: [ main, master, cypress_githubactions ]
  pull_request:
    branches: [ main, master, cypress_githubactions ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Cypress tests inside Docker Container
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          container: cypress/included:15.14.2
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          FORCE_NODE_VERSION: 20

          CYPRESS_BASE_URL: https://qauto.forstudy.space
          CYPRESS_USER: guest
          CYPRESS_PASSWORD: welcome2qauto
          CYPRESS_userEmail: "test_prod@example.com"
          CYPRESS_userPassword: "6WiiW!9LTxAQBWW"